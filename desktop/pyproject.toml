[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "model2db"
version = "0.1.0"
description = "Desktop tool that turns a data model into a reviewable database design and the code that creates it, locally."
readme = "README_en.md"
license = "MIT"
authors = [{ name = "Raul Estevez" }]
requires-python = ">=3.11"
# PyYAML reads YAML inputs, as the yaml package does in the web version
dependencies = ["PySide6>=6.10", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.17"]
# Packaging the app; Pillow only regenerates the icons
build = ["pyinstaller>=6.22", "pillow>=11.0"]

[project.scripts]
model2db = "model2db.__main__:main"

[tool.setuptools.packages.find]
include = ["model2db*"]

[tool.setuptools.package-data]
model2db = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
